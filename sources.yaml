# =============================================================================
# MANUAL CHECK — LinkedIn & paywalled
# =============================================================================
# These can't be reliably automated. The digest will surface a reminder
# 1x/week to do a manual scan of these specific feeds/accounts.

- name: LinkedIn — Naval News company page
  type: manual_check
  url: https://www.linkedin.com/company/naval-news/
  tier: 2
  tags: [linkedin, naval, usv]
  category_hint: news_repost_candidate
  notes: >
    Reminder only. The agent can't scrape LinkedIn safely. Once a week
    the digest will nudge you to check this manually.

- name: LinkedIn — USVs & autonomy thought leaders
  type: manual_check
  url: "https://www.linkedin.com/search/results/content/?keywords=USV%20autonomous%20surface%20vessel"
  tier: 2
  tags: [linkedin, usv, autonomy]
  category_hint: news_repost_candidate
  notes: >
    Saved search reminder. Pin the people whose posts you'd want to
    repost; the agent will only nudge.

- name: Lloyd's List
  type: manual_check
  url: https://www.lloydslist.com/
  tier: 3
