# =============================================================================
# TIER 1 — Institutions & think tanks (sourced_post candidates — PDF gold)
# =============================================================================
# These are the citable-source factories. Lower volume, much higher
# per-item value. PDFs from here are exactly what the existing sourced-post
# skill is designed around.

- name: NATO MARCOM (Allied Maritime Command)
  type: scrape
  url: https://mc.nato.int/media-centre/news/
  tier: 1
  tags: [nato, maritime, exercises, doctrine, usv]
  category_hint: sourced_post_candidate
  notes: >
    REPMUS, Dynamic Messenger, undersea infrastructure — directly relevant
    to Navictus's near-term milestones. No RSS, scrape required.

- name: NATO ACT (Allied Command Transformation)
  type: scrape
  url: https://www.act.nato.int/articles/
  tier: 1
  tags: [nato, innovation, doctrine, autonomy, technology]
  category_hint: sourced_post_candidate
  notes: >
    Innovation Challenges, warfare development. Often publishes citable PDFs.

- name: European Defence Agency (EDA)
  type: scrape
  url: https://eda.europa.eu/news-and-events/news
  tier: 1
  tags: [eu, defense, maritime, eumss, procurement, marsur]
  category_hint: sourced_post_candidate
  notes: >
    European Combat Vessel, MARSUR, CARD reports. Very high signal for the
    EU dual-use positioning.

- name: EEAS — Maritime Security
  type: scrape
  url: https://www.eeas.europa.eu/eeas/maritime-security_en
  tier: 1
  tags: [eu, maritime_security, eumss, csdp, atalanta]
  category_hint: sourced_post_candidate
  notes: >
    EU Maritime Security Strategy updates. Action plan revisions are
    cite-gold for LinkedIn posts.

- name: CSIS — Maritime & International Security
  type: scrape
  url: https://www.csis.org/topics/maritime-issues-and-oceans
  tier: 1
  tags: [maritime, security, geopolitics, undersea, mda]
  category_hint: sourced_post_candidate
  notes: >
    Contested Seas, MDA research. CSIS publishes substantive PDFs regularly.

- name: Atlantic Council — Maritime Security
  type: scrape
  url: https://www.atlanticcouncil.org/issue/maritime-security/
  tier: 1
  tags: [maritime, security, transatlantic, undersea, ports]
  category_hint: sourced_post_candidate

- name: RUSI — International Security
  type: rss
  url: https://www.rusi.org/explore-our-research/publications/rss
  tier: 1
  tags: [defense, security, autonomy, naval, undersea]
  category_hint: sourced_post_candidate
  notes: >
    Verify exact RSS URL on first run; RUSI's feed structure has changed
    before. Strong on Atlantic Bastion / autonomous ASW concepts.

- name: IISS — Military Balance & Analysis
  type: scrape
  url: https://www.iiss.org/online-analysis/
  tier: 2
  tags: [defense, balance, procurement, geopolitics]
  category_hint: sourced_post_candidate


# =============================================================================
# TIER 2 — Specialist / niche
# =============================================================================

- name: ICPC (International Cable Protection Committee)
