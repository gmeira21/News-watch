# =============================================================================
# Navictus News-Watch — sources.yaml
# =============================================================================
# This file is the brain of the system. Each entry tells the fetcher where to
# look and how to interpret what it finds. Tune the tiers, add/remove sources,
# and adjust topic tags as Navictus's positioning evolves.
#
# Schema:
#   name:           Human-readable label (shows in the digest)
#   type:           "rss" | "scrape" | "manual_check"
#                   - rss:          feedparser handles it directly
#                   - scrape:       custom scraper in lib/fetch.py
#                   - manual_check: surfaced as a reminder in the digest;
#                                   no automated fetch (LinkedIn, paywalled sites)
#   url:            The feed URL (rss) or the page URL (scrape/manual_check)
#   tier:           1 = must-read, 2 = high-value, 3 = noisier but worth scanning
#   tags:           Topical tags — used to bias the relevance filter
#   category_hint:  "sourced_post_candidate" | "news_repost_candidate" | "either"
#                   - sourced_post_candidate: think tanks, NATO, EU, ICPC etc.
#                     These produce PDF reports good for sourced LinkedIn posts.
#                   - news_repost_candidate: news outlets — articles you'd repost
#                     with thoughts.
#                   - either: depends on the specific item.
# =============================================================================


# =============================================================================
# TIER 1 — Core defense & naval news outlets (news_repost candidates)
# =============================================================================
# These are the day-to-day news engines. High volume, but USV / naval autonomy
# / port protection items land here first. Mostly RSS; all reputable.

- name: Naval News
  type: rss
  url: https://www.navalnews.com/feed/
  tier: 1
  tags: [naval, usv, autonomy, defense, navy, technology]
  category_hint: news_repost_candidate
  notes: >
    The single most important source. Heavy USV / unmanned coverage.
    Headline-driven, often cross-posts to LinkedIn.

- name: USNI News
  type: rss
  url: https://news.usni.org/feed
  tier: 1
  tags: [naval, navy, maritime_policy, usv, autonomy, defense]
  category_hint: news_repost_candidate
  notes: >
    US Naval Institute. Strong on USN procurement, doctrine, and
    Congressional Research Service summaries (those often have citable PDFs).

- name: Shephard Media — Naval
  type: scrape
  url: https://www.shephardmedia.com/news/
  tier: 1
  tags: [naval, usv, autonomy, defense, procurement]
  category_hint: news_repost_candidate
  notes: >
    Strong on USV-specific deep dives. Confirmed in May 2026 they cover
    MARTAC, Saildrone, etc. No clean RSS; needs a small scraper.

- name: Defense News — Naval & Unmanned
  type: rss
  url: https://www.defensenews.com/arc/outboundfeeds/rss/category/naval/?outputType=xml
  tier: 1
  tags: [naval, navy, unmanned, defense, procurement, congress]
  category_hint: news_repost_candidate
  notes: >
    Naval section RSS. Sister feed for /unmanned/ also worth adding if it
    fires cleanly during testing.

- name: Breaking Defense
  type: rss
  url: https://breakingdefense.com/feed/
  tier: 1
  tags: [defense, procurement, policy, technology, autonomy]
  category_hint: news_repost_candidate
  notes: >
    Higher signal-to-noise than most. Filter for naval/USV-tagged items.


