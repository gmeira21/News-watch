# Manual companion to run.yml: same pipeline, no schedule, with a
# dry_run toggle exposed in the Actions UI. Use this to trigger a
# test run without committing changes.
name: Navictus News Watch (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Telegram send, no store writes)"
        type: boolean
        required: false
        default: false

jobs:
  run-digest:
    name: Run digest (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Shares the same cache key prefix as the scheduled workflow so a
      # manual run picks up the latest seen.db. Dry runs don't mutate
      # seen.db, so re-saving it under a fresh run_id is a no-op.
      - name: Cache seen.db
        uses: actions/cache@v4
        with:
          path: seen.db
          key: news-watch-seen-db-${{ github.run_id }}
          restore-keys: |
            news-watch-seen-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py --dry-run
          else
            python run.py
          fi
